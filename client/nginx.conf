server {
    listen 80;
    server_name pm.tomotek.vn api-pm.tomotek.vn localhost;

    # Cấu hình dung lượng upload ảnh/file đính kèm (cho task-bugs)
    client_max_body_size 20M;

    # 1. Route cho Frontend (React Web App)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy cho API Backend (api-pm.tomotek.vn hoặc /api)
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        
        # Header truyền IP thật và domain của client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình WebSocket (phục vụ Realtime Dashboard / Notification)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}